<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ title or "Print" }} | Service Center CRM</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body.printdoc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: #e8eaee; color: #1f2a44; font-size: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
		.print-toolbar { position: sticky; top: 0; background: #1f2a44; padding: 10px 16px; display: flex; gap: 10px; z-index: 10; }
		.print-toolbar button { background: #ec2e5d; color: #fff; border: none; border-radius: 999px;
			padding: 8px 18px; font-weight: 600; cursor: pointer; font-size: 13px; font-family: inherit; }
		.print-toolbar button.alt { background: transparent; border: 1px solid rgba(255,255,255,.4); }
		.sheet { max-width: 820px; margin: 18px auto; background: #fff; padding: 34px 38px; box-shadow: 0 2px 14px rgba(0,0,0,.18); }
		.doc-head { display: flex; align-items: center; gap: 18px; border-bottom: 3px solid #ec2e5d; padding-bottom: 14px; margin-bottom: 20px; }
		.doc-head img { height: 44px; }
		.doc-title { flex: 1; }
		.doc-title h1 { font-size: 20px; }
		.doc-title .sub { color: #8a94a6; font-size: 12px; margin-top: 3px; }
		.doc-meta { text-align: right; color: #8a94a6; font-size: 11px; line-height: 1.6; }
		h2.sec { font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; color: #003277;
			border-left: 4px solid #ec2e5d; padding-left: 8px; margin: 22px 0 10px; break-after: avoid; }
		table.t { width: 100%; border-collapse: collapse; font-size: 11.5px; }
		table.t th { background: #f4f5f7; text-align: left; padding: 7px 9px; border: 1px solid #e2e5ea;
			font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; color: #5a6478; }
		table.t td { padding: 7px 9px; border: 1px solid #e2e5ea; vertical-align: top; }
		table.t tr { break-inside: avoid; }
		.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 18px; margin-bottom: 6px; }
		.kv .k { font-size: 10px; text-transform: uppercase; color: #8a94a6; letter-spacing: .04em; font-weight: 700; }
		.kv .v { font-weight: 600; margin-top: 2px; font-size: 12px; }
		.pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 10px; font-weight: 700; background: #eef0f4; }
		.pill--red { background: #fde7ee; color: #c01643; }
		.pill--green { background: #e7f8ee; color: #15803d; }
		.pill--amber { background: #fdf3e0; color: #b45309; }
		.pill--navy { background: #e6ecf4; color: #003277; }
		tr.newdmg td { background: #fde7ee; }
		.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
		.photos figure { break-inside: avoid; }
		.photos img { width: 100%; height: 150px; object-fit: cover; border: 1px solid #e2e5ea; border-radius: 6px; }
		.photos figcaption { font-size: 10px; color: #8a94a6; margin-top: 3px; }
		.sigs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 52px; break-inside: avoid; }
		.sig { border-top: 1.5px solid #1f2a44; padding-top: 6px; font-size: 11px; color: #5a6478; }
		.sig b { display: block; color: #1f2a44; font-size: 12px; margin-bottom: 2px; }
		.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
		.stat { border: 1px solid #e2e5ea; border-radius: 8px; padding: 10px 12px; break-inside: avoid; }
		.stat .l { font-size: 9.5px; text-transform: uppercase; color: #8a94a6; font-weight: 700; letter-spacing: .04em; }
		.stat .n { font-size: 16px; font-weight: 800; margin-top: 3px; }
		.muted { color: #8a94a6; }
		.right { text-align: right; }
		.doc-foot { margin-top: 28px; padding-top: 10px; border-top: 1px solid #e2e5ea; color: #8a94a6; font-size: 10px; text-align: center; }
		@media print {
			body.printdoc { background: #fff; }
			.print-toolbar { display: none; }
			.sheet { box-shadow: none; margin: 0; max-width: none; padding: 0; }
		}
		@page { size: A4; margin: 13mm 12mm; }
	</style>
</head>
<body class="printdoc">
	<div class="print-toolbar">
		<button type="button" onclick="window.print()">Print / Save as PDF</button>
		<button type="button" class="alt" onclick="window.close()">Close</button>
	</div>
	<div class="sheet">
		<header class="doc-head">
			<img src="/assets/a3_workshop_frontend/images/redline-logo.png" alt="Redlines International">
			<div class="doc-title">
				<h1>{% block doc_title %}{% endblock %}</h1>
				<div class="sub">{% block doc_subtitle %}{% endblock %}</div>
			</div>
			<div class="doc-meta">
				<div>Printed: {{ printed_on }}</div>
				<div>By: {{ printed_by }}</div>
			</div>
		</header>
		{% block content %}{% endblock %}
		<footer class="doc-foot">Redlines International — Service Center CRM · Vehicle History &amp; Driver Performance</footer>
	</div>
	<script>
		// open the browser print dialog once images have loaded
		window.addEventListener("load", function () { setTimeout(function () { window.print(); }, 350); });
	</script>
</body>
</html>
